<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dartboard Optimizer</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: white;
        overflow: hidden;
      }
      
      #app {
        display: flex;
        height: 100vh;
      }
      
      #canvas-container {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      #dartboard-canvas {
        border: 1px solid #333;
        background: #000;
      }
      
      #controls {
        width: 300px;
        background: #1a1a1a;
        padding: 20px;
        border-left: 1px solid #333;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      
      .control-group label {
        font-size: 14px;
        color: #ccc;
      }
      
      .slider {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: #333;
        outline: none;
        -webkit-appearance: none;
      }
      
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffda03;
        cursor: pointer;
      }
      
      .slider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffda03;
        cursor: pointer;
        border: none;
      }
      
      .value-display {
        font-size: 12px;
        color: #888;
        text-align: right;
      }
      
      #score-display {
        background: #2a2a2a;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #333;
      }
      
      #score-display h3 {
        margin: 0 0 10px 0;
        font-size: 16px;
        color: #ffda03;
      }
      
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ffda03;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-container">
        <canvas id="dartboard-canvas" width="700" height="700"></canvas>
        <div id="loading">Generating sunflower pattern...</div>
      </div>
      
      <div id="controls">
        <h2>Dartboard Optimizer</h2>
        
        <div class="control-group">
          <label for="x-slider">Target X Position</label>
          <input type="range" id="x-slider" class="slider" min="-1.3" max="1.3" step="0.01" value="0">
          <div id="x-value" class="value-display">0.00</div>
        </div>
        
        <div class="control-group">
          <label for="y-slider">Target Y Position</label>
          <input type="range" id="y-slider" class="slider" min="-1.3" max="1.3" step="0.01" value="0">
          <div id="y-value" class="value-display">0.00</div>
        </div>
        
        <div class="control-group">
          <label for="r-slider">Throwing Accuracy (Radius)</label>
          <input type="range" id="r-slider" class="slider" min="0" max="1.3" step="0.01" value="0.3">
          <div id="r-value" class="value-display">0.30</div>
        </div>
        
        <div id="score-display">
          <h3>Expected Score</h3>
          <div id="score-value">0</div>
          <div id="points-in-range">Points in range: 0</div>
        </div>
        
        <button id="toggle-heatmap" style="background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 4px; cursor: pointer;">
          Toggle Heatmap
        </button>
        
        <div style="margin-top: auto; font-size: 12px; color: #666;">
          <p>Interactive dartboard strategy analyzer</p>
          <p>Move sliders to explore optimal aiming positions</p>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
